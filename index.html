          <button class="btn btn-primary" onclick="saveRecommendation(${carId})">Сохранить</button>
          <button class="btn btn-outline" onclick="closeModal()">Закрыть</button>
        </div>`;
      modal.classList.add('active');
    }

    function completeRecommendation(recId, carId) {
      const rec = DB.recommendations.find(r => r.id === recId);
      if (rec) {
        rec.status = 'completed';
        rec.completed_at = new Date().toISOString();
        saveDB();
        showRecommendations(carId);
        showNotification('Рекомендация выполнена!', rec.text, '✅');
      }
    }

    function reactivateRecommendation(recId, carId) {
      const rec = DB.recommendations.find(r => r.id === recId);
      if (rec) {
        rec.status = 'active';
        rec.completed_at = null;
        saveDB();
        showRecommendations(carId);
        showNotification('Рекомендация возвращена', rec.text, '↺');
      }
    }

    function saveRecommendation(carId) {
      const text = document.getElementById('recommendationText').value;
      if (!text) { 
        showNotification('Ошибка', 'Введите текст рекомендации', '❌');
        return; 
      }
      
      const existingRec = DB.recommendations.find(r => 
        r.car_id === carId && 
        r.text === text && 
        r.status === 'active'
      );
      
      if (existingRec) {
        showNotification('Внимание', 'Такая рекомендация уже существует', '⚠️');
        return;
      }
      
      DB.recommendations.push({
        id: Date.now(),
        car_id: carId,
        text: text,
        date: new Date().toISOString().split('T')[0],
        status: 'active',
        created_at: new Date().toISOString()
      });
      saveDB();
      closeModal();
      showNotification('Рекомендация сохранена!', text, '💡');
    }

    // -------------------- ЗАРПЛАТЫ (АДМИН) - С ОБЩЕЙ КАССОЙ --------------------
    function loadSalaryForAdmin() {
      const todayStr = new Date().toISOString().split('T')[0];
      const weekRange = getWeekRange();
      
      const todayBookings = DB.bookings.filter(b => b.date === todayStr && b.status === 'completed');
      const weekBookings = DB.bookings.filter(b => 
        b.date >= weekRange.startDate && 
        b.date <= weekRange.endDate && 
        b.status === 'completed'
      );
      
      // Общая касса за сегодня (все услуги)
      let todayTotalRevenue = 0;
      todayBookings.forEach(booking => {
        todayTotalRevenue += (booking.final_price || booking.price || 0);
      });
      
      // Касса админа (только те услуги, которые входят в его процент)
      let todayAdminRevenue = 0;
      todayBookings.forEach(booking => {
        const bookingServices = booking.service_ids || [booking.service_id];
        bookingServices.forEach(serviceId => {
          const service = DB.services.find(s => s.id === serviceId);
          if (service && !NON_ADMIN_SERVICES.includes(service.name)) {
            const car = DB.cars.find(c => c.id === booking.car_id);
            if (car) {
              todayAdminRevenue += service[car.body_type] || service.легковая;
            }
          }
        });
      });
      
      let adminPercent = 5;
      if (todayAdminRevenue >= 20000 && todayAdminRevenue <= 39500) adminPercent = 7;
      else if (todayAdminRevenue >= 39501) adminPercent = 10;
      
      const adminEarnings = todayAdminRevenue * adminPercent / 100;
      
      const staffStats = {};
      DB.staff.forEach(staff => {
        staffStats[staff.id] = { 
          name: staff.name, 
          todayEarnings: 0, 
          todayCount: 0,
          weekEarnings: 0,
          weekCount: 0,
          isAdmin: currentAdmin && currentAdmin.id === staff.id 
        };
      });
      
      todayBookings.forEach(booking => {
        if (booking.staff_ids && booking.staff_ids.length > 0) {
          const staffCount = booking.staff_ids.length;
          const amount = (booking.price || 0) * STAFF_PERCENT / staffCount;
          booking.staff_ids.forEach(staffId => {
            if (staffStats[staffId]) {
              staffStats[staffId].todayEarnings += amount;
              staffStats[staffId].todayCount += 1;
            }
          });
        }
      });
      
      weekBookings.forEach(booking => {
        if (booking.staff_ids && booking.staff_ids.length > 0) {
          const staffCount = booking.staff_ids.length;
          const amount = (booking.price || 0) * STAFF_PERCENT / staffCount;
          booking.staff_ids.forEach(staffId => {
            if (staffStats[staffId]) {
              staffStats[staffId].weekEarnings += amount;
              staffStats[staffId].weekCount += 1;
            }
          });
        }
      });
      
      let html = `<h2>Зарплаты</h2>
        <div class="card" style="border:1px solid var(--accent);cursor:default;transform:none;">
          <h3>💰 Общая касса за сегодня</h3>
          <p style="font-size:1.5rem;color:var(--accent);font-weight:700;">${todayTotalRevenue.toLocaleString()} ₽</p>
          <p style="color:var(--text-secondary);">Выполнено: ${todayBookings.length} записей</p>
        </div>
        <div class="card" style="border:1px solid var(--accent);cursor:default;transform:none;background:rgba(245,166,35,0.05);">
          <h3>💰 Касса админа за сегодня</h3>
          <p style="font-size:1.5rem;color:var(--accent);font-weight:700;">${todayAdminRevenue.toLocaleString()} ₽</p>
          <p style="color:var(--text-secondary);">Из них ${adminPercent}% = ${adminEarnings.toLocaleString()} ₽</p>
        </div>
        <div class="card" style="background:rgba(245,166,35,0.1);cursor:default;transform:none;">
          <h3>👨‍💼 ${currentAdmin ? escapeHtml(currentAdmin.name) : 'Администратор'} (${adminPercent}%)</h3>
          <p style="font-size:1.5rem;color:var(--accent);font-weight:700;">${adminEarnings.toLocaleString()} ₽</p>
          <p style="color:var(--text-secondary);">Заработано за сегодня</p>
          ${currentAdmin && staffStats[currentAdmin.id] ? `
            <p style="color:var(--success);font-size:0.9rem;margin-top:5px;">+ ${staffStats[currentAdmin.id].todayEarnings.toLocaleString()} ₽ за работу детейлером</p>
          ` : ''}
        </div>
        
        <h3 style="font-size:1rem;margin:20px 0 10px;">Зарплаты сотрудников</h3>`;
      
      Object.values(staffStats).forEach(staff => {
        if (!staff.isAdmin) {
          html += `<div class="card card-clickable" onclick="showStaffSalaryDetails('${escapeHtml(staff.name)}', ${staff.todayEarnings}, ${staff.todayCount}, ${staff.weekEarnings}, ${staff.weekCount})">
            <div class="flex-between">
              <h4 style="text-transform:none;">${escapeHtml(staff.name)}</h4>
              <span style="color:var(--accent);font-weight:700;">${staff.weekEarnings.toLocaleString()} ₽</span>
            </div>
            <p style="color:var(--text-secondary);font-size:0.8rem;">Сегодня: ${staff.todayEarnings.toLocaleString()} ₽ (${staff.todayCount} зап.)</p>
            <p style="color:var(--text-secondary);font-size:0.8rem;">Неделя: ${staff.weekEarnings.toLocaleString()} ₽ (${staff.weekCount} зап.)</p>
          </div>`;
        }
      });
      
      document.getElementById('adminContent').innerHTML = html;
    }

    function showStaffSalaryDetails(name, todayEarnings, todayCount, weekEarnings, weekCount) {
      showNotification(

        `Сегодня: ${todayEarnings.toLocaleString()} ₽ (${todayCount} записей)\nЗа неделю: ${weekEarnings.toLocaleString()} ₽ (${weekCount} записей)`,

    function loadWeeklyPlan() {
      const weekRange = getWeekRange();
      
      const weekBookings = DB.bookings.filter(b => 
        b.date >= weekRange.startDate && 
        b.date <= weekRange.endDate && 
        b.status === 'completed'
      );
      
      let weekRevenue = 0;
      weekBookings.forEach(b => { 
        weekRevenue += (b.final_price || b.price) || 0; 
      });
      
      const remaining = Math.max(WEEKLY_PLAN - weekRevenue, 0);
      const percentComplete = Math.min((weekRevenue / WEEKLY_PLAN) * 100, 100);
      
      let html = `<h2>Недельный план</h2>
        <div class="card" style="border:1px solid var(--accent);cursor:default;transform:none;">
          <h3>📊 План кассы</h3>
          <p style="font-size:2rem;color:var(--accent);font-weight:700;">${weekRevenue.toLocaleString()} ₽</p>
          <p style="color:var(--text-secondary);">из ${WEEKLY_PLAN.toLocaleString()} ₽</p>
          
          <div style="width:100%;height:10px;background:var(--bg);border-radius:5px;margin-top:15px;overflow:hidden;">
            <div style="width:${percentComplete}%;height:100%;background:var(--accent-gradient);border-radius:5px;transition:width 0.3s;"></div>
          </div>
          <p style="color:var(--text-secondary);margin-top:10px;">Выполнено: ${percentComplete.toFixed(1)}%</p>
          
          ${remaining > 0 ? `
            <p style="color:var(--accent);margin-top:15px;">Осталось: ${remaining.toLocaleString()} ₽</p>
            <p style="color:var(--text-secondary);font-size:0.8rem;">Период: ${weekRange.startDate} — ${weekRange.endDate}</p>
            <p style="color:var(--success);margin-top:10px;">🎉 Мотивация: общий корпоратив за выполнение плана!</p>
          ` : `
            <p style="color:var(--success);margin-top:15px;">✅ План выполнен!</p>
            <p style="color:var(--success);font-size:0.8rem;">Период: ${weekRange.startDate} — ${weekRange.endDate}</p>
          `}
        </div>`;
      
      document.getElementById('adminContent').innerHTML = html;
    }

    // -------------------- АНАЛИТИКА ДЛЯ РУКОВОДИТЕЛЯ --------------------
    function loadManagerAnalytics() {
      const today = new Date().toISOString().split('T')[0];
      const weekRange = getWeekRange();
      
      const todayBookings = DB.bookings.filter(b => b.date === today && b.status === 'completed');
      const weekBookings = DB.bookings.filter(b => 
        b.date >= weekRange.startDate && 
        b.date <= weekRange.endDate && 
        b.status === 'completed'
      );
      const monthBookings = DB.bookings.filter(b => {
        const bookingDate = new Date(b.date);
        const monthAgo = new Date();
        monthAgo.setMonth(monthAgo.getMonth() - 1);
        return bookingDate >= monthAgo && b.status === 'completed';
      });
      
      const todayRevenue = todayBookings.reduce((sum, b) => sum + ((b.final_price || b.price) || 0), 0);
      const weekRevenue = weekBookings.reduce((sum, b) => sum + ((b.final_price || b.price) || 0), 0);
      const monthRevenue = monthBookings.reduce((sum, b) => sum + ((b.final_price || b.price) || 0), 0);
      
      const todayCars = todayBookings.length;
      const weekCars = weekBookings.length;
      const monthCars = monthBookings.length;
      
      const todayAvg = todayCars > 0 ? todayRevenue / todayCars : 0;
      const weekAvg = weekCars > 0 ? weekRevenue / weekCars : 0;
      const monthAvg = monthCars > 0 ? monthRevenue / monthCars : 0;
      
      const clientSpending = {};
      DB.bookings.filter(b => b.status === 'completed').forEach(b => {
        const amount = b.final_price || b.price || 0;
        clientSpending[b.client_id] = (clientSpending[b.client_id] || 0) + amount;
      });
      
      const topClients = Object.entries(clientSpending)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([clientId, amount]) => {
          const client = DB.clients.find(c => c.id === parseInt(clientId));
          return { client, amount };
        })
        .filter(item => item.client);
      
      const serviceCount = {};
      DB.bookings.filter(b => b.status === 'completed').forEach(b => {
        const serviceIds = b.service_ids || [b.service_id];
        serviceIds.forEach(id => {
          serviceCount[id] = (serviceCount[id] || 0) + 1;
        });
      });
      
      const topServices = Object.entries(serviceCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([id, count]) => {
          const service = DB.services.find(s => s.id === parseInt(id));
          return { service, count };
        })
        .filter(item => item.service);
      
      const dayStats = {};
      DB.bookings.filter(b => b.status === 'completed').forEach(b => {
        const day = new Date(b.date).getDay();
        const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const key = dayNames[day];
        if (!dayStats[key]) dayStats[key] = { count: 0, revenue: 0 };
        dayStats[key].count += 1;
        dayStats[key].revenue += (b.final_price || b.price || 0);
      });
      
      const dayOrder = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const sortedDayStats = dayOrder.map(day => ({
        day,
        ...(dayStats[day] || { count: 0, revenue: 0 })
      }));
      
      const avgDailyRevenue = weekCars > 0 ? weekRevenue / 7 : 0;
      const projectedRevenue = avgDailyRevenue * 7;
      
      let html = `<h2>📊 Бизнес-аналитика</h2>
        
        <div class="stat-card">
          <div class="stat-item-card">
            <div class="stat-number">${todayCars}</div>
            <div class="stat-label">Сегодня машин</div>
          </div>
          <div class="stat-item-card">
            <div class="stat-number">${todayRevenue.toLocaleString()} ₽</div>
            <div class="stat-label">Сегодня выручка</div>
          </div>
          <div class="stat-item-card">
            <div class="stat-number">${weekCars}</div>
            <div class="stat-label">За неделю машин</div>
          </div>
          <div class="stat-item-card">
            <div class="stat-number">${weekRevenue.toLocaleString()} ₽</div>
            <div class="stat-label">За неделю выручка</div>
          </div>
        </div>
        
        <div class="card" style="cursor:default;transform:none;">
          <h3 style="font-size:0.9rem;margin-bottom:10px;">📈 Средний чек</h3>
          <div class="flex-between"><span>Сегодня:</span><span style="color:var(--accent);font-weight:700;">${todayAvg.toLocaleString()} ₽</span></div>
          <div class="flex-between"><span>Неделя:</span><span style="color:var(--accent);font-weight:700;">${weekAvg.toLocaleString()} ₽</span></div>
          <div class="flex-between"><span>Месяц:</span><span style="color:var(--accent);font-weight:700;">${monthAvg.toLocaleString()} ₽</span></div>
        </div>
        
        <div class="card" style="cursor:default;transform:none;">
          <h3 style="font-size:0.9rem;margin-bottom:10px;">🏆 Топ-клиенты</h3>
          ${topClients.length > 0 ? topClients.map((item, index) => {
            const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
            return `
              <div class="top-client">
                <div class="rank ${rankClass}">#${index + 1}</div>
                <div class="info">
                  <div class="name">${escapeHtml(item.client.name)}</div>
                  <div class="details">${item.client.phone}</div>
                </div>
                <div class="amount">${item.amount.toLocaleString()} ₽</div>
              </div>
            `;
          }).join('') : '<p style="color:var(--text-secondary);text-align:center;">Нет данных</p>'}
        </div>
        
        <div class="card" style="cursor:default;transform:none;">
          <h3 style="font-size:0.9rem;margin-bottom:10px;">🔥 Популярные услуги</h3>
          ${topServices.length > 0 ? topServices.map(item => `
            <div class="flex-between" style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
              <span>${escapeHtml(item.service.name)}</span>
              <span style="color:var(--accent);font-weight:700;">${item.count} раз</span>
            </div>
          `).join('') : '<p style="color:var(--text-secondary);text-align:center;">Нет данных</p>'}
        </div>
        
        <div class="card" style="cursor:default;transform:none;">
          <h3 style="font-size:0.9rem;margin-bottom:10px;">📅 Активность по дням</h3>
          ${sortedDayStats.map(day => `
            <div class="flex-between" style="padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
              <span>${day.day}</span>
              <span style="color:var(--text-secondary);font-size:0.8rem;">${day.count} машин · ${day.revenue.toLocaleString()} ₽</span>
            </div>
          `).join('')}
        </div>
        
        <div class="card" style="border:1px solid var(--accent);cursor:default;transform:none;">
          <h3 style="font-size:0.9rem;margin-bottom:10px;">🔮 Прогноз на неделю</h3>
          <div class="flex-between">
            <span>Прогнозируемая выручка:</span>
            <span style="color:var(--accent);font-weight:700;">${projectedRevenue.toLocaleString()} ₽</span>
          </div>
          <div class="flex-between" style="margin-top:5px;">
            <span>Цель на неделю:</span>
            <span style="color:var(--text-secondary);">${WEEKLY_PLAN.toLocaleString()} ₽</span>
          </div>
          <div style="width:100%;height:6px;background:var(--bg);border-radius:3px;margin-top:10px;overflow:hidden;">
            <div style="width:${Math.min((projectedRevenue / WEEKLY_PLAN) * 100, 100)}%;height:100%;background:var(--accent-gradient);border-radius:3px;"></div>
          </div>
          <p style="color:var(--text-secondary);font-size:0.7rem;margin-top:5px;">Прогноз выполняется на ${Math.min((projectedRevenue / WEEKLY_PLAN) * 100, 100).toFixed(1)}% от плана</p>
        </div>`;
      
      document.getElementById('managerContent').innerHTML = html;
    }

    // -------------------- ЗАРПЛАТЫ (РУКОВОДИТЕЛЬ) --------------------
    function loadSalary() {
      const todayStr = new Date().toISOString().split('T')[0];
      const weekRange = getWeekRange();
      
      const todayBookings = DB.bookings.filter(b => b.date === todayStr && b.status === 'completed');
      const weekBookings = DB.bookings.filter(b => 
        b.date >= weekRange.startDate && 
        b.date <= weekRange.endDate && 
        b.status === 'completed'
      );
      
      let totalWeekRevenue = 0;
      weekBookings.forEach(b => { totalWeekRevenue += (b.final_price || b.price) || 0; });
      
      let totalWeekSalary = 0;
      
      let todayAdminRevenue = 0;
      todayBookings.forEach(booking => {
        const bookingServices = booking.service_ids || [booking.service_id];
        bookingServices.forEach(serviceId => {
          const service = DB.services.find(s => s.id === serviceId);
          if (service && !NON_ADMIN_SERVICES.includes(service.name)) {
            const car = DB.cars.find(c => c.id === booking.car_id);
            if (car) {
              todayAdminRevenue += service[car.body_type] || service.легковая;
            }
          }
        });
      });
      
      let adminPercent = 5;
      if (todayAdminRevenue >= 20000 && todayAdminRevenue <= 39500) adminPercent = 7;
      else if (todayAdminRevenue >= 39501) adminPercent = 10;
      
      const adminEarnings = todayAdminRevenue * adminPercent / 100;
      
      const staffStats = {};
      DB.staff.forEach(staff => {
        staffStats[staff.id] = { 
          name: staff.name, 
          todayEarnings: 0, 
          todayCount: 0,
          weekEarnings: 0,
          weekCount: 0,
          isAdmin: currentAdmin && currentAdmin.id === staff.id 
        };
      });
      
      todayBookings.forEach(booking => {
        if (booking.staff_ids && booking.staff_ids.length > 0) {
          const staffCount = booking.staff_ids.length;
          const amount = (booking.price || 0) * STAFF_PERCENT / staffCount;
          booking.staff_ids.forEach(staffId => {
            if (staffStats[staffId]) {
              staffStats[staffId].todayEarnings += amount;
              staffStats[staffId].todayCount += 1;
            }
          });
        }
      });
      
      weekBookings.forEach(booking => {
        if (booking.staff_ids && booking.staff_ids.length > 0) {
          const staffCount = booking.staff_ids.length;
          const amount = (booking.price || 0) * STAFF_PERCENT / staffCount;
          booking.staff_ids.forEach(staffId => {
            if (staffStats[staffId]) {
              staffStats[staffId].weekEarnings += amount;
              staffStats[staffId].weekCount += 1;
              totalWeekSalary += amount;
            }
          });
        }
      });
      
      let html = `<h2>Зарплаты</h2>
        <div class="card" style="margin-bottom:20px;border:1px solid var(--accent);cursor:default;transform:none;">
          <p style="color:var(--text-secondary);">Период: ${weekRange.startDate} — ${weekRange.endDate}</p>
          <p style="color:var(--accent);font-weight:700;">Выплата: пятница</p>
          <div style="margin-top:10px;padding:10px;background:rgba(245,166,35,0.1);border-radius:8px;">
            <p style="color:var(--text-secondary);">Общая выручка за неделю:</p>
            <p style="color:var(--accent);font-weight:700;font-size:1.3rem;">${totalWeekRevenue.toLocaleString()} ₽</p>
          </div>
          <div style="margin-top:10px;padding:10px;background:rgba(16,185,129,0.1);border-radius:8px;">
            <p style="color:var(--text-secondary);">Общая ЗП за неделю:</p>
            <p style="color:var(--success);font-weight:700;font-size:1.3rem;">${totalWeekSalary.toLocaleString()} ₽</p>
          </div>
        </div>
        
        <div class="card" style="border:1px solid var(--accent);cursor:default;transform:none;">
          <div class="flex-between">
            <h3>👨‍💼 ${currentAdmin ? escapeHtml(currentAdmin.name) : 'Администратор'} (${adminPercent}%)</h3>
            <span style="color:var(--accent);font-weight:700;">${adminEarnings.toLocaleString()} ₽</span>
          </div>
          <p style="color:var(--text-secondary);font-size:0.8rem;">За сегодня</p>
          ${currentAdmin && staffStats[currentAdmin.id] ? `
            <p style="color:var(--success);font-size:0.9rem;margin-top:5px;">+ ${staffStats[currentAdmin.id].todayEarnings.toLocaleString()} ₽ за работу детейлером</p>
          ` : ''}
        </div>`;
      
      Object.values(staffStats).forEach(staff => {
        if (!staff.isAdmin) {
          html += `<div class="card card-clickable" onclick="showStaffSalaryDetails('${escapeHtml(staff.name)}', ${staff.todayEarnings}, ${staff.todayCount}, ${staff.weekEarnings}, ${staff.weekCount})">
            <div class="flex-between">
              <h4 style="text-transform:none;">${escapeHtml(staff.name)}</h4>
              <span style="color:var(--accent);font-weight:700;">${staff.weekEarnings.toLocaleString()} ₽</span>
            </div>
            <p style="color:var(--text-secondary);font-size:0.8rem;">Сегодня: ${staff.todayEarnings.toLocaleString()} ₽ (${staff.todayCount} зап.)</p>
            <p style="color:var(--text-secondary);font-size:0.8rem;">Неделя: ${staff.weekEarnings.toLocaleString()} ₽ (${staff.weekCount} зап.)</p>
          </div>`;
        }
      });
      
      document.getElementById('managerContent').innerHTML = html;
    }

    // -------------------- СКЛАД (РУКОВОДИТЕЛЬ) --------------------
    function loadInventoryManager() {
      let html = `<h2>Управление складом</h2>
        <button class="btn btn-primary" onclick="showAddInventoryItem()">+ Добавить позицию</button>`;
      
      DB.inventory.forEach(item => {
        const percent = (item.stock / item.min_stock) * 100;
        let statusClass = 'tag-green';
        let statusText = 'ОК';
        if (percent < 100) { statusClass = 'tag-red'; statusText = 'Заканчивается!'; }
        else if (percent < 150) { statusClass = 'tag-yellow'; statusText = 'Мало'; }
        
        html += `<div class="card" style="cursor:default;transform:none;">
          <div class="flex-between">
            <h4 style="text-transform:none;">${escapeHtml(item.name)}</h4>
            <span class="tag ${statusClass}">${statusText}</span>
          </div>
          <p style="color:var(--text-secondary);">Остаток: ${item.stock} ${item.unit}</p>
          <p style="color:var(--text-secondary);">Мин. запас: ${item.min_stock} ${item.unit}</p>
          <div style="display:flex;gap:10px;margin-top:10px;">
            <button class="btn btn-outline" style="flex:1;padding:8px;font-size:0.7rem;" onclick="updateStock(${item.id})">Изменить</button>
            <button class="btn btn-danger" style="flex:1;padding:8px;font-size:0.7rem;" onclick="deleteInventoryItem(${item.id})">Удалить</button>
          </div>
        </div>`;
      });
      
      document.getElementById('managerContent').innerHTML = html;
    }

    function showAddInventoryItem() {
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="modal-content">
          <button class="modal-close-btn" onclick="closeModal()">✕</button>
          <h3 style="color:var(--accent);margin-bottom:20px;">Новая позиция</h3>
          <div class="input-group"><label>Название</label><input type="text" class="input-field" id="newItemName"></div>
          <div class="input-group"><label>Количество</label><input type="number" class="input-field" id="newItemStock" min="0"></div>
          <div class="input-group"><label>Единица измерения</label>
            <select class="input-field" id="newItemUnit">
              <option value="мл">мл</option>
              <option value="л">л</option>
              <option value="шт">шт</option>
              <option value="г">г</option>
              <option value="кг">кг</option>
            </select>
          </div>
          <div class="input-group"><label>Минимальный запас</label><input type="number" class="input-field" id="newItemMinStock" min="0"></div>
          <button class="btn btn-primary" onclick="saveNewInventoryItem()">Сохранить</button>
          <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        </div>`;
      modal.classList.add('active');
    }

    function saveNewInventoryItem() {
      const name = document.getElementById('newItemName').value;
      const stock = parseFloat(document.getElementById('newItemStock').value);
      const unit = document.getElementById('newItemUnit').value;
      const minStock = parseFloat(document.getElementById('newItemMinStock').value);
      
      if (!name || isNaN(stock) || isNaN(minStock)) {
        showNotification('Ошибка', 'Заполните все поля', '❌');
        return;
      }
      
      const newItem = {
        id: Date.now(),
        name: name,
        stock: stock,
        unit: unit,
        min_stock: minStock
      };
      
      DB.inventory.push(newItem);
      saveDB();
      closeModal();
      loadInventoryManager();
      showNotification('Позиция добавлена!', `${name}: ${stock} ${unit}`, '✅');
    }

    function deleteInventoryItem(itemId) {
      if (confirm('Удалить позицию со склада?')) {
        DB.inventory = DB.inventory.filter(i => i.id !== itemId);
        saveDB();
        loadInventoryManager();
      }
    }

    function updateStock(itemId) {
      const item = DB.inventory.find(i => i.id === itemId);
      if (!item) return;
      
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="modal-content">
          <button class="modal-close-btn" onclick="closeModal()">✕</button>
          <h3 style="color:var(--accent);margin-bottom:20px;">Изменить остаток</h3>
          <div class="card" style="cursor:default;transform:none;">
            <h4 style="text-transform:none;">${escapeHtml(item.name)}</h4>
            <p style="color:var(--text-secondary);">Текущий остаток: ${item.stock} ${item.unit}</p>
          </div>
          <div class="input-group">
            <label>Новый остаток (${item.unit})</label>
            <input type="number" class="input-field" id="newStockValue" value="${item.stock}" min="0">
          </div>
          <button class="btn btn-primary" onclick="saveStockUpdate(${itemId})">Сохранить</button>
          <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        </div>`;
      modal.classList.add('active');
    }

    function saveStockUpdate(itemId) {
      const newStock = parseFloat(document.getElementById('newStockValue').value);
      if (isNaN(newStock) || newStock < 0) {
        showNotification('Ошибка', 'Введите корректное значение', '❌');
        return;
      }
      
      const item = DB.inventory.find(i => i.id === itemId);
      if (item) {
        item.stock = newStock;
        saveDB();
        closeModal();
        loadInventoryManager();
        showNotification('Остаток обновлен!', `${item.name}: ${newStock} ${item.unit}`, '✅');
      }
    }

    // ================================================================
    // 13. ОБНОВЛЕНИЕ ДАННЫХ
    // ================================================================

    function updateAllData() {
      saveDB();
      updatePhoneIndex();
      
      const activeScreen = document.querySelector('.screen.active');
      if (!activeScreen) return;
      
      if (currentUser) {
        if (currentUser.role === 'admin') {
          if (activeScreen.id === 'adminScreen') {
            const activeTab = document.querySelector('.nav-item.active');
            if (activeTab) {
              const tab = activeTab.textContent.trim();
              if (tab.includes('График')) loadAdminBookings();
              else if (tab.includes('Клиенты')) loadClients();
              else if (tab.includes('Зарплаты')) loadSalaryForAdmin();
              else if (tab.includes('План')) loadWeeklyPlan();
            }
          }
        } else if (currentUser.role === 'manager') {
          if (activeScreen.id === 'managerScreen') {
            const activeTab = document.querySelector('.nav-item.active');
            if (activeTab) {
              const tab = activeTab.textContent.trim();
              if (tab.includes('График')) loadManagerSchedule();
              else if (tab.includes('Аналитика')) loadManagerAnalytics();
              else if (tab.includes('Зарплаты')) loadSalary();
              else if (tab.includes('Склад')) loadInventoryManager();
            }
          }
        }
      }
    }

    // ================================================================
    // 14. МОДАЛЬНОЕ ОКНО
    // ================================================================

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
      modal.innerHTML = '';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // ================================================================
    // 15. ЗАПУСК
    // ================================================================

    try {
      loadDB();
    } catch (error) {
      console.error('Ошибка при запуске приложения:', error);
      showNotification('Ошибка', 'Не удалось загрузить данные', '❌');
    }
  </script>
</body>
</html>
