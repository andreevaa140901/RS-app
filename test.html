<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест подключения к Reg.ru</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: #12121a;
            border: 1px solid #1e1e2d;
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #F5A623; }
        button {
            background: #F5A623;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }
        .log {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест подключения к Reg.ru</h1>
    
    <div class="card">
        <h3>📊 Статус</h3>
        <div id="status">⏳ Проверка...</div>
    </div>
    
    <div class="card">
        <h3>🔄 Синхронизация</h3>
        <button onclick="testSync()">📤 Синхронизировать данные</button>
        <div id="syncResult" style="margin-top:10px;"></div>
    </div>
    
    <div class="card">
        <h3>📋 Лог</h3>
        <div id="log" class="log">Готов...</div>
    </div>

    <script src="config.js"></script>
    <script src="src/core/DataManager.js"></script>
    
    <script>
        function logMessage(msg, type = 'info') {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const colors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#F5A623'
            };
            log.innerHTML += `<div style="color: ${colors[type] || '#fff'}">[${time}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function testSync() {
            const result = document.getElementById('syncResult');
            result.innerHTML = '⏳ Синхронизация...';
            
            try {
                const data = JSON.parse(localStorage.getItem('rs_detailing_v24'));
                
                if (!data) {
                    result.innerHTML = '❌ Нет данных в localStorage';
                    return;
                }
                
                logMessage(`📦 Найдено: ${data.clients?.length || 0} клиентов, ${data.cars?.length || 0} авто, ${data.bookings?.length || 0} записей`);
                
                await window.dataManager.saveData(data);
                
                result.innerHTML = '✅ Синхронизация запущена!';
                logMessage('✅ Данные отправлены на синхронизацию', 'success');
                
                setTimeout(() => {
                    const status = window.dataManager.getStatus();
                    document.getElementById('status').innerHTML = `
                        <div>✅ DataManager готов</div>
                        <div>🔄 Синхронизация: ${status.syncEnabled ? 'ВКЛЮЧЕНА ✅' : 'ОТКЛЮЧЕНА ⚠️'}</div>
                        <div>📦 В очереди: ${status.pendingCount}</div>
                        <div>⚡ В процессе: ${status.isSyncing ? 'ДА' : 'НЕТ'}</div>
                        <div>📡 API: ${status.apiUrl}</div>
                    `;
                }, 2000);
                
            } catch (error) {
                result.innerHTML = '❌ Ошибка: ' + error.message;
                logMessage('❌ Ошибка: ' + error.message, 'error');
            }
        }

        (async function init() {
            logMessage('🚀 Инициализация...', 'info');
            
            const dataManager = new DataManager();
            await dataManager.initialize();
            window.dataManager = dataManager;
            
            const status = dataManager.getStatus();
            document.getElementById('status').innerHTML = `
                <div>✅ DataManager готов</div>
                <div>🔄 Синхронизация: ${status.syncEnabled ? 'ВКЛЮЧЕНА ✅' : 'ОТКЛЮЧЕНА ⚠️'}</div>
                <div>📦 В очереди: ${status.pendingCount}</div>
                <div>⚡ В процессе: ${status.isSyncing ? 'ДА' : 'НЕТ'}</div>
                <div>📡 API: ${status.apiUrl}</div>
            `;
            
            logMessage(status.syncEnabled ? '✅ Синхронизация включена' : '⚠️ Синхронизация отключена', status.syncEnabled ? 'success' : 'error');
        })();
    </script>
</body>
</html>
