<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест подключения к Reg.ru</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: #12121a;
            border: 1px solid #1e1e2d;
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #F5A623; }
        button {
            background: #F5A623;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }
        .status-detail {
            padding: 4px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест подключения к Reg.ru</h1>
    
    <div class="card">
        <h3>📊 Статус</h3>
        <div id="status">
            <div class="status-detail">⏳ Загрузка...</div>
        </div>
    </div>
    
    <div class="card">
        <h3>🔄 Синхронизация</h3>
        <button id="syncBtn" onclick="testSync()" disabled>📤 Синхронизировать данные</button>
        <div id="syncResult" style="margin-top:10px;"></div>
    </div>
    
    <div class="card">
        <h3>📋 Лог</h3>
        <div id="log" class="log">Готов...</div>
    </div>

    <!-- ✅ ПОДКЛЮЧАЕМ СКРИПТЫ -->
    <script src="config.js"></script>
    <script src="datamanager.js"></script>
    
    <script>
        let dataManagerInstance = null;

        function logMessage(msg, type = 'info') {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const colors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#F5A623'
            };
            log.innerHTML += `<div style="color: ${colors[type] || '#fff'}">[${time}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus(status) {
            document.getElementById('status').innerHTML = status;
        }

        async function testSync() {
            const btn = document.getElementById('syncBtn');
            const result = document.getElementById('syncResult');
            
            btn.disabled = true;
            result.innerHTML = '⏳ Синхронизация...';
            
            try {
                if (!dataManagerInstance) {
                    throw new Error('DataManager не инициализирован');
                }
                
                const data = JSON.parse(localStorage.getItem('rs_detailing_v24'));
                
                if (!data) {
                    result.innerHTML = '❌ Нет данных в localStorage';
                    return;
                }
                
                logMessage(`📦 Найдено: ${data.clients?.length || 0} клиентов, ${data.cars?.length || 0} авто, ${data.bookings?.length || 0} записей`);
                
                await dataManagerInstance.saveData(data);
                
                result.innerHTML = '✅ Синхронизация запущена!';
                logMessage('✅ Данные отправлены на синхронизацию', 'success');
                
                setTimeout(() => {
                    const status = dataManagerInstance.getStatus();
                    updateStatus(`
                        <div class="status-detail">✅ DataManager готов</div>
                        <div class="status-detail">🔄 Синхронизация: ${status.syncEnabled ? 'ВКЛЮЧЕНА ✅' : 'ОТКЛЮЧЕНА ⚠️'}</div>
                        <div class="status-detail">📦 В очереди: ${status.pendingCount}</div>
                        <div class="status-detail">⚡ В процессе: ${status.isSyncing ? 'ДА' : 'НЕТ'}</div>
                        <div class="status-detail">📡 API: ${status.apiUrl || 'не указан'}</div>
                    `);
                }, 2000);
                
            } catch (error) {
                result.innerHTML = '❌ Ошибка: ' + error.message;
                logMessage('❌ Ошибка: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        (async function init() {
            logMessage('🚀 Инициализация...', 'info');
            
            try {
                if (typeof window.DB_CONFIG === 'undefined') {
                    logMessage('❌ config.js не загружен!', 'error');
                    updateStatus(`
                        <div class="status-detail" style="color: #ef4444;">❌ config.js не загружен!</div>
                        <div class="status-detail">Проверьте файл: config.js</div>
                    `);
                    return;
                }
                logMessage('✅ config.js загружен', 'success');

                // Ждём загрузки DataManager
                let attempts = 0;
                while (typeof DataManager === 'undefined' && attempts < 10) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    attempts++;
                }

                if (typeof DataManager === 'undefined') {
                    logMessage('❌ DataManager не загружен!', 'error');
                    updateStatus(`
                        <div class="status-detail" style="color: #ef4444;">❌ DataManager не загружен!</div>
                        <div class="status-detail">Проверьте файл: datamanager.js</div>
                    `);
                    return;
                }
                logMessage('✅ DataManager загружен', 'success');
                
                dataManagerInstance = new DataManager();
                await dataManagerInstance.initialize();
                window.dataManager = dataManagerInstance;
                
                const status = dataManagerInstance.getStatus();
                updateStatus(`
                    <div class="status-detail">✅ DataManager готов</div>
                    <div class="status-detail">🔄 Синхронизация: ${status.syncEnabled ? 'ВКЛЮЧЕНА ✅' : 'ОТКЛЮЧЕНА ⚠️'}</div>
                    <div class="status-detail">📦 В очереди: ${status.pendingCount}</div>
                    <div class="status-detail">⚡ В процессе: ${status.isSyncing ? 'ДА' : 'НЕТ'}</div>
                    <div class="status-detail">📡 API: ${status.apiUrl || 'не указан'}</div>
                `);
                
                logMessage(status.syncEnabled ? '✅ Синхронизация включена' : '⚠️ Синхронизация отключена', status.syncEnabled ? 'success' : 'error');
                
                document.getElementById('syncBtn').disabled = false;
                
            } catch (error) {
                logMessage('❌ Критическая ошибка: ' + error.message, 'error');
                updateStatus(`
                    <div class="status-detail" style="color: #ef4444;">❌ Ошибка: ${error.message}</div>
                `);
            }
        })();
    </script>
</body>
</html>
